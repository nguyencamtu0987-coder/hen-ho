<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Date?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffe6e6;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* Khung chứa nội dung */
        .container {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(217, 56, 56, 0.15);
            max-width: 500px;
            width: 100%;
            border: 2px solid #ffb3b3;
            z-index: 10;
            transition: all 0.3s ease;
        }

        h1 {
            color: #d93838;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .highlight {
            color: #ff4d4d;
            font-weight: bold;
        }

        /* Khu vực chứa nút - Ban đầu để Flexbox để 2 nút NGANG HÀNG nhau */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff4d4d;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
        }

        #yesBtn:hover {
            background-color: #ff3333;
            transform: scale(1.08);
        }

        #noBtn {
            background-color: #a6a6a6;
            color: white;
            /* Thiết lập ban đầu ở trạng thái tương đối để nằm cùng hàng */
            position: relative; 
            z-index: 11;
        }

        /* Hộp thoại thông báo ngọt ngào khi bấm YES */
        .success-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            z-index: 100;
            width: 90%;
            max-width: 450px;
            border: 3px solid #ff4d4d;
            animation: popIn 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        .success-box h2 {
            color: #ff4d4d;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .success-box p {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 0;
        }

        /* CSS tạo hiệu ứng Trái tim rơi nền */
        .heart-fall {
            position: absolute;
            color: #ff9999;
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <h1>Will you be my date?</h1>
        <p>Hẹn <span class="highlight">Nhựt</span> đi date vào <span class="highlight">thứ 7 tuần sau</span> nha! 💕</p>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="selectYes()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Are you sure?</button>
        </div>
    </div>

    <div class="success-box" id="successBox">
        <h2>Chốt kèo luôn nha! 🥰</h2>
        <p>Hẹn Nhựt thứ 7 tuần sau, không gặp không về! Nhựt chỉ được phép mỉm cười đồng ý thôi chứ không chạy thoát được đâu nhé! 🌹🎉</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainCard = document.getElementById('mainCard');
        const successBox = document.getElementById('successBox');
        let isFirstMove = true;

        // 1. Tạo hiệu ứng TRÁI TIM RƠI ngẫu nhiên khi mở trang web
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerHTML = '❤';
            
            // Vị trí ngang ngẫu nhiên
            heart.style.left = Math.random() * 100 + "vw";
            // Kích thước ngẫu nhiên
            const size = Math.random() * 15 + 10;
            heart.style.fontSize = size + "px";
            // Tốc độ rơi ngẫu nhiên (từ 3s đến 6s)
            heart.style.animationDuration = Math.random() * 3 + 3 + "s";
            // Độ mờ ngẫu nhiên
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            
            document.body.appendChild(heart);
            
            // Xóa trái tim sau khi rơi xong để tránh nặng máy
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        // Tạo liên tục các trái tim rơi
        setInterval(createHeart, 300);

        // 2. Hàm xử lý nút "Are you sure?" bỏ chạy
        function moveButton() {
            // Khi di chuột vào lần đầu tiên, chuyển nút sang trạng thái 'fixed' để nó tự do bay nhảy
            if (isFirstMove) {
                noBtn.style.position = 'fixed';
                isFirstMove = false;
            }

            // Tính toán giới hạn màn hình an toàn
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            let randomX = Math.floor(Math.random() * maxX);
            let randomY = Math.floor(Math.random() * maxY);

            // Tránh việc nút nhảy đè vào giữa cái khung hộp thoại chính
            const rect = mainCard.getBoundingClientRect();
            if (randomX > rect.left - 40 && randomX < rect.right + 40 &&
                randomY > rect.top - 40 && randomY < rect.bottom + 40) {
                randomX = randomX + (randomX < window.innerWidth / 2 ? -180 : 180);
                randomY = randomY + (randomY < window.innerHeight / 2 ? -180 : 180);
            }

            // Gán tọa độ mới bắt nút nhảy đi chỗ khác
            noBtn.style.left = Math.max(10, Math.min(randomX, maxX)) + 'px';
            noBtn.style.top = Math.max(10, Math.min(randomY, maxY)) + 'px';
        }

        // 3. Hàm kích hoạt hiệu ứng khi chọn "YES"
        function selectYes() {
            // Ẩn hộp thoại cũ đi và hiện hộp thoại chúc mừng ngọt ngào lên
            mainCard.style.display = 'none';
            successBox.style.display = 'block';

            // Hiệu ứng pháo hoa nổ liên tục 3 lần
            let duration = 3 * 1000;
            let end = Date.now() + duration;

            (function frame() {
                // Bắn pháo hoa bên trái
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 }
                });
                // Bắn pháo hoa bên phải
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 }
                });

                // Hiệu ứng thả CÁNH HOA HỒNG rơi lãng mạn từ trên xuống
                confetti({
                    particleCount: 2,
                    spread: 360,
                    ticks: 50,
                    gravity: 0.8,
                    decay: 0.94,
                    startVelocity: 10,
                    colors: ['#ff4d4d', '#ffb3b3', '#ffccd5', '#ff3366'], // Tone màu hoa hồng đỏ hồng
                    origin: {
                        x: Math.random(),
                        y: Math.random() * 0.3 // Rơi từ trên đỉnh màn hình xuống
                    }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
