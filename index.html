<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Date?</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffe6e6; /* Màu nền hồng pastel ban đầu */
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
            transition: background-color 0.8s ease; /* Hiệu ứng đổi màu nền mượt mà */
        }

        /* Khung nội dung chính */
        .container {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(217, 56, 56, 0.1);
            max-width: 500px;
            width: 100%;
            border: 2px solid #ffb3b3;
            z-index: 10;
            transition: all 0.3s ease;
        }

        h1 {
            color: #d93838;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .highlight {
            color: #ff4d4d;
            font-weight: bold;
        }

        /* Khối chứa 2 nút ban đầu NGANG HÀNG */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        #yesBtn {
            background-color: #ff4d4d;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
        }

        #yesBtn:hover {
            background-color: #ff3333;
            transform: scale(1.08);
        }

        #noBtn {
            background-color: #a6a6a6;
            color: white;
            position: relative; 
            z-index: 11;
        }

        /* Hộp thoại thông báo khi chọn YES */
        .success-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            z-index: 100;
            width: 90%;
            max-width: 450px;
            border: 3px solid #ff4d4d;
            animation: popIn 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        .success-box h2 {
            color: #ff4d4d;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .success-box p {
            font-size: 1.1rem;
            color: #444;
        }

        /* Hiệu ứng vật rơi nền */
        .falling-item {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <h1>Will you be my date?</h1>
        <p>Hẹn <span class="highlight">Nhựt</span> đi date vào <span class="highlight">thứ 7 tuần sau</span> nha! 💕</p>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="selectYes()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div class="success-box" id="successBox">
        <h2>Chốt kèo rồi nha! 😏</h2>
        <p>Cái nút bên kia chỉ làm cảnh thôi chứ chạy đằng trời.</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainCard = document.getElementById('mainCard');
        const successBox = document.getElementById('successBox');
        let isFirstMove = true;
        let activeEffect = 'heart'; // Ban đầu rơi trái tim

        // Hàm tạo vật rơi tổng hợp
        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            
            if (activeEffect === 'heart') {
                item.innerHTML = '❤';
                item.style.color = '#ff9999';
            } else {
                // Danh sách hoa dễ thương khi chọn YES
                const flowers = ['🌸', '🌼', '🌹', '🌻', '🌺'];
                item.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
            }
            
            item.style.left = Math.random() * 100 + "vw";
            const size = Math.random() * 15 + 12;
            item.style.fontSize = size + "px";
            item.style.animationDuration = Math.random() * 3 + 3 + "s";
            item.style.opacity = Math.random() * 0.6 + 0.4;
            
            document.body.appendChild(item);
            
            setTimeout(() => {
                item.remove();
            }, 6000);
        }

        // Chạy hiệu ứng rơi liên tục
        setInterval(createFallingItem, 250);

        // Hàm xử lý nút "No" bỏ chạy
        function moveButton() {
            if (isFirstMove) {
                noBtn.style.position = 'fixed';
                isFirstMove = false;
            }

            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            let randomX = Math.floor(Math.random() * maxX);
            let randomY = Math.floor(Math.random() * maxY);

            const rect = mainCard.getBoundingClientRect();
            if (randomX > rect.left - 40 && randomX < rect.right + 40 &&
                randomY > rect.top - 40 && randomY < rect.bottom + 40) {
                randomX = randomX + (randomX < window.innerWidth / 2 ? -180 : 180);
                randomY = randomY + (randomY < window.innerHeight / 2 ? -180 : 180);
            }

            noBtn.style.left = Math.max(10, Math.min(randomX, maxX)) + 'px';
            noBtn.style.top = Math.max(10, Math.min(randomY, maxY)) + 'px';
        }

        // Hàm xử lý khi bấm YES
        function selectYes() {
            mainCard.style.display = 'none';
            successBox.style.display = 'block';
            
            // 1. Đổi màu nền sang xanh mint pastel tươi sáng
            document.body.style.backgroundColor = '#e6fffa'; 
            
            // 2. Chuyển hiệu ứng rơi từ trái tim sang hoa dễ thương
            activeEffect = 'flower';

            // 3. Kích hoạt pháo hoa giấy rực rỡ nổ liên tục trong 3 giây
            let duration = 3 * 1000;
            let end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.85 }
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.85 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
